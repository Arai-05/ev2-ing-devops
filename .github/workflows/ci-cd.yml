name: CI/CD ms-vehiculos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ms-vehiculos

jobs:
  #Escaneo Snyk
  snyk:
    name: Snyk
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    defaults:
      run:
        working-directory: ms-vehiculos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Snyk CLI
        run: npm install -g snyk

      - name: Snyk test
        run: snyk test --severity-threshold=high --file=pom.xml --json-file-output=snyk-report.json

      - name: Subir reporte Snyk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: ms-vehiculos/snyk-report.json

  #Pruebas unitarias 
  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    needs: snyk
    defaults:
      run:
        working-directory: ms-vehiculos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      - name: Build y tests
        run: mvn -B clean verify

      - name: Subir reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: ms-vehiculos/target/site/jacoco/

  #Analisis de calidad/seguridad con SonarQube Cloud 
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ms-vehiculos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      - name: Analisis Sonar (falla si no pasa el quality gate)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Arai-05_ev2-ing-devops \
            -Dsonar.organization=arai-05 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.token=${SONAR_TOKEN}

  #Build de la imagen Docker y despliegue 
  deploy:
    name: Build Docker y despliegue (Compose)
    runs-on: ubuntu-latest
    needs: [test, sonar]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de imagen en minusculas (ghcr lo exige)
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Build imagen Docker (tag = SHA del commit)
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest ms-vehiculos

      - name: Desplegar con Docker Compose
        env:
          APP_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:9004/; then echo; exit 0; fi
            sleep 4
          done
          docker compose logs app
          exit 1

      - name: Logs en caso de fallo
        if: failure()
        run: docker compose logs

      - name: Login en GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen (trazabilidad por SHA)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

      - name: Bajar entorno
        if: always()
        run: docker compose down -v
